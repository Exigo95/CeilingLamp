name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'windows/CeilingLamp.Tray/Ui/app.html', '.github/workflows/android-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CeilingLight.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CeilingLight-android
          path: android/CeilingLight.apk

      - name: Publish to the "Android app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-app --yes --cleanup-tag || true
          gh release create android-app CeilingLight.apk --title "Ceiling Light for Android" --target "$GITHUB_SHA" \
            --notes "Open this page on your phone, download CeilingLight.apk and install it (allow installing from your browser when asked). Built from commit $GITHUB_SHA."
